<!doctype html><html><body style="margin:0;background:#fff">
<iframe id="f" style="border:0;width:1400px;height:900px"></iframe>
<pre id="out" style="font:13px monospace;white-space:pre-wrap">waiting</pre>
<script>
// Process Architecture Map: appearance — presets × dark/light schemes with WCAG AA checks,
// secondary colour, navigation mode (all levels / one level at a time), group shape, expand
// default, activity layout, card style, corners, spacing, typography, numbering, colour
// overrides with the contrast report, reset and persistence.
const KEY = 'agile-infographics.process-architecture.v1', AKEY = KEY + '.appearance';
const f = document.getElementById('f'); const R = []; const errors = [];
const ok = (n, c, extra = '') => R.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : '  ' + extra));
const wait = ms => new Promise(r => setTimeout(r, ms));
let d, w;
function load(width = 1400) {
  f.style.width = width + 'px';
  return new Promise(res => {
    f.onload = async () => {
      d = f.contentDocument; w = f.contentWindow;
      w.addEventListener('error', e => errors.push(String(e.message)));
      const ce = w.console.error; w.console.error = (...a) => { errors.push(a.join(' ')); ce.apply(w.console, a); };
      for (let i = 0; i < 60 && !d.querySelector('.pa-group'); i++) await wait(100);
      const st = d.createElement('style'); st.textContent = '*{transition:none!important}'; d.head.appendChild(st);
      await wait(200); res();
    };
    f.src = '/index.html?' + Math.random() + '#/process-architecture';
  });
}
const $ = s => d.querySelector(s), $$ = s => [...d.querySelectorAll(s)];
function type(el, text) {
  el.focus();
  Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype, 'value').set.call(el, text);
  el.dispatchEvent(new w.Event('input', { bubbles: true }));
}
const click = el => el.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
const storedA = () => JSON.parse(w.localStorage.getItem(AKEY));
const stored = () => JSON.parse(w.localStorage.getItem(KEY));
const v = name => $('.pa').style.getPropertyValue(name).trim();
const seg = (label, text) => [...$(`[data-panel="appearance"] [role=group][aria-label="${label}"]`).querySelectorAll('button')].find(b => b.textContent.trim() === text);
const pick = async (label, text) => { click(seg(label, text)); await wait(120); };
const cs = (el, p, pseudo) => w.getComputedStyle(el, pseudo)[p];
const node = id => $(`[data-node="${id}"]`);
const levels = () => $$('.pa-level').map(s => s.className.match(/pa-level-(\d)/)[1]).join('');
const rgb = s => s.startsWith('#') ? [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).map(Number).slice(0, 3);
const lum = c => { const [r, g, b] = rgb(c).map(x => { x /= 255; return x <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const cr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

/** Every text/background pair, including text actually rendered on each coloured group, meets WCAG AA. */
function contrastIssues() {
  const pairs = [
    ['heading on bg', '--pa-heading-on-bg', '--pa-background'], ['subtitle on bg', '--pa-subtitle-on-bg', '--pa-background'],
    ['titles on cards', '--pa-heading', '--pa-surface'], ['text on cards', '--pa-text', '--pa-surface'],
    ['muted on cards', '--pa-text-muted', '--pa-surface'], ['accent on cards', '--pa-accent', '--pa-surface'],
    ['L0 title', '--pa-l0-text', '--pa-l0'], ['L0 details', '--pa-l0-muted', '--pa-l0'], ['step numbers', '--pa-step-text', '--pa-step'],
  ];
  const bad = pairs.map(([n, fg, bg]) => [n, cr(v(fg), v(bg))]).filter(([, r]) => r < 4.5).map(([n, r]) => `${n} ${r.toFixed(2)}`);
  $$('.pa-group').forEach(g => { const r = cr(cs(g.querySelector('.pa-group-title'), 'color'), cs(g, 'backgroundColor', '::before')); if (r < 4.5) bad.push(`group ${g.dataset.node} ${r.toFixed(2)}`); });
  return bad;
}
const rects = () => $$('.pa-group, .pa-l0').map(e => { const r = e.getBoundingClientRect(); return [r.left, r.top, r.width, r.height].map(Math.round).join(','); }).join('|');

async function run() {
  localStorage.removeItem(KEY); localStorage.removeItem(AKEY);
  await load(1400);
  ok('default theme: navy, dark, cascade, chevrons, collapsed, flow, numbering', storedA().base === '#1f4670' && storedA().scheme === 'dark' && $('.pa').dataset.navigation === 'cascade' && $('.pa').dataset.shape === 'chevron' && storedA().expandDefault === 'collapsed' && storedA().numbering === true);
  ok('contrast report: all pass by default', /All text meets/.test($('[data-panel="appearance"] .pae-report').textContent) && contrastIssues().length === 0, JSON.stringify(contrastIssues()));

  // ---- Presets × schemes ----
  const geo0 = rects(); const failures = [];
  for (const scheme of ['Dark', 'Light']) {
    await pick('Colour scheme', scheme);
    for (const p of $$('[data-panel="appearance"] [aria-label="Theme presets"] button')) {
      click(p); await wait(80);
      const bad = contrastIssues();
      if (bad.length) failures.push(`${scheme}/${p.textContent.trim()}: ${bad.join(', ')}`);
      if (rects() !== geo0) failures.push(`${scheme}/${p.textContent.trim()}: layout changed`);
    }
  }
  ok('9 presets × dark/light: every text pair and every group label ≥ 4.5:1, layout unchanged', failures.length === 0, JSON.stringify(failures.slice(0, 4)));
  await pick('Colour scheme', 'Light'); click($('[data-panel="appearance"] [aria-label="Theme presets"] button')); await wait(80);
  ok('light scheme: light background and cards, dark text', lum(v('--pa-background')) > 0.8 && lum(v('--pa-surface')) > 0.9 && lum(v('--pa-heading')) < 0.1 && $('.pae').dataset.scheme === 'light');
  await pick('Colour scheme', 'Dark');
  const sec = $('input[aria-label="Secondary colour"]'); type(sec, '#d97706'); await wait(80);
  ok('secondary colour drives accents and the last core group', storedA().secondary === '#d97706' && contrastIssues().length === 0 && v('--pa-core-to') !== '', JSON.stringify(contrastIssues()));
  click([...$('[data-panel="appearance"]').querySelectorAll('.te-link')].find(b => b.textContent.trim() === 'Automatic')); await wait(60);
  ok('secondary back to automatic', storedA().secondary === null);

  // ---- Navigation mode ----
  click(node('g-build')); await wait(40); click(node('p-test')); await wait(60);
  ok('cascade: overview, group and process levels all visible', levels() === '012');
  await pick('Navigation', 'One level at a time');
  ok('focus mode: only the current level (the process) is shown', levels() === '2' && $('.pa').dataset.navigation === 'focus');
  click($('[data-action="up"]')); await wait(60);
  ok('focus mode: up shows only the group level', levels() === '1');
  click($('[data-action="up"]')); await wait(60);
  ok('focus mode: then the overview', levels() === '0');
  await pick('Navigation', 'All levels');

  // ---- Group shape, expand default, activity layout ----
  ok('chevrons clip core groups into arrows', cs(node('g-build'), 'clipPath', '::before').startsWith('polygon'));
  await pick('Process groups', 'Blocks');
  ok('blocks: no clipping, rounded corners', cs(node('g-build'), 'clipPath', '::before') === 'none' && parseFloat(cs(node('g-build'), 'borderTopLeftRadius', '::before')) > 0);
  await pick('Process groups', 'Chevrons');
  await pick('Groups start', 'Expanded');
  ok('groups start expanded: every group lists its processes', $$('.pa-group').every(g => g.querySelector('.pa-pills') || !g.querySelector('.pa-expand')) && $$('.pa-pill').length === 17);
  await pick('Groups start', 'Collapsed');
  ok('groups start collapsed', $$('.pa-pill').length === 0);
  click(node('g-build')); await wait(40); click(node('p-test')); await wait(60);
  const steps = () => $$('.pa-level-2 .pa-step').map(e => e.getBoundingClientRect());
  ok('flow layout: activities side by side', steps().length === 4 && Math.abs(steps()[1].top - steps()[0].top) < 2);
  await pick('Activities', 'Timeline');
  ok('timeline layout: activities one under another', $('.pa').dataset.activityLayout === 'list' && steps().every((r, i) => !i || r.top > steps()[i - 1].top));
  await pick('Activities', 'Flow');

  // ---- Cards, corners, spacing, typography, numbering ----
  const card = () => $('.pa-level-1 .pa-card');
  await pick('Cards', 'Outline');
  ok('outline cards: transparent fill', cs(card(), 'backgroundColor') === 'rgba(0, 0, 0, 0)');
  await pick('Cards', 'Filled');
  ok('filled cards: no accent bar', cs(card(), 'backgroundColor') !== 'rgba(0, 0, 0, 0)' && parseFloat(cs(card(), 'borderLeftWidth')) <= 1.5);
  await pick('Cards', 'Accent bar');
  ok('accent cards: 4px bar in the group colour', parseFloat(cs(card(), 'borderLeftWidth')) === 4);
  const radius = async t => { await pick('Corners', t); return parseFloat(cs(card(), 'borderTopLeftRadius')); };
  const rs = [await radius('Square'), await radius('Soft'), await radius('Round')];
  ok('corner radius square < soft < round', rs[0] < rs[1] && rs[1] < rs[2], JSON.stringify(rs));
  const gap = async t => { await pick('Spacing', t); return parseFloat(cs($('.pa-level-1 .pa-cards'), 'rowGap')); };
  const gs = [await gap('Compact'), await gap('Spacious'), await gap('Comfortable')];
  ok('spacing compact < comfortable < spacious', gs[0] < gs[2] && gs[2] < gs[1], JSON.stringify(gs));
  await pick('Text size', 'XL');
  ok('text size XL scales the map', Math.abs(parseFloat(cs($('.pa'), 'fontSize')) - 19.2) < 0.1 && d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1);
  await pick('Text size', 'M');
  await pick('Heading weight', 'Heavy');
  ok('heading weight applied', cs($('.pa-level-title'), 'fontWeight') === '800');
  await pick('Heading weight', 'Bold');
  await pick('Numbering', 'Off');
  ok('numbering off: no automatic numbers', $$('.pa-group .pa-code').length === 0 && $$('.pa-level-1 .pa-card .pa-code').length === 0);
  await pick('Numbering', '1.2.3');
  ok('numbering on again', $$('.pa-group .pa-code').length === 8);

  // ---- Overrides and the contrast report ----
  click($('[data-panel="appearance"] .pae-details summary')); await wait(40);
  ok('11 colour overrides offered', $$('.pae-override').length === 11);
  type($('input[aria-label="Cards colour"]'), '#f4f4f4'); await wait(80);
  ok('light card override: untouched text adapts', storedA().overrides.surface === '#f4f4f4' && cr(v('--pa-heading'), '#f4f4f4') >= 7 && cr(v('--pa-text-muted'), '#f4f4f4') >= 4.5);
  type($('input[aria-label="Headings colour"]'), '#dddddd'); await wait(80);
  ok('a poor override is flagged in the report, not blocked', $('[data-panel="appearance"] .pae-report').classList.contains('has-warnings') && /Titles on cards/.test($('[data-panel="appearance"] .pae-report').textContent));
  type($('input[aria-label="First core group colour"]'), '#ffe08a'); await wait(80);
  ok('group labels switch to dark text on a light group colour', cr(cs(node('g-plan').querySelector('.pa-group-title'), 'color'), '#ffe08a') >= 4.5);
  click($('button[aria-label="Use automatic Headings colour"]')); await wait(40);
  click($('button[aria-label="Use automatic Cards colour"]')); await wait(40);
  click($('button[aria-label="Use automatic First core group colour"]')); await wait(40);
  ok('overrides back to automatic', Object.keys(storedA().overrides).length === 0);

  // ---- Persistence and reset ----
  await pick('Corners', 'Round'); await pick('Colour scheme', 'Light'); await pick('Activities', 'Timeline');
  const snap = JSON.stringify(storedA()), style = $('.pa').getAttribute('style');
  await load(1400);
  ok('appearance persisted after reload', JSON.stringify(storedA()) === snap && $('.pa').getAttribute('style') === style);
  const content = JSON.stringify(stored());
  click($$('button').find(b => b.textContent.trim() === 'Reset appearance')); await wait(100);
  ok('Reset appearance restores the defaults', storedA().scheme === 'dark' && storedA().radius === 'soft' && storedA().activityLayout === 'flow');
  ok('Reset appearance keeps the content', JSON.stringify(stored()) === content);
  view: {
    click($$('.gl-view button').find(b => b.textContent.trim() === 'Display')); await wait(150);
    ok('display mode uses the same appearance', $('.pa').dataset.scheme === 'dark' && !$('[data-panel]'));
  }

  ok('no console errors / exceptions', errors.length === 0, JSON.stringify(errors.slice(0, 5)));
  localStorage.removeItem(KEY); localStorage.removeItem(AKEY);
  document.getElementById('out').textContent = 'SUMMARY ' + R.filter(x => x.startsWith('PASS')).length + '/' + R.length + ' passed\n' + R.filter(x => x.startsWith('FAIL')).join('\n') + '\n----\n' + R.join('\n');
}
run().catch(e => { document.getElementById('out').textContent = 'CRASH ' + e.stack + '\n' + R.filter(x => x.startsWith('FAIL')).join('\n') + '\n----\n' + R.join('\n'); });
</script></body></html>
