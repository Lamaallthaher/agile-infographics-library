<!doctype html><html><body style="margin:0;background:#fff">
<iframe id="f" style="border:0;width:1300px;height:120px"></iframe>
<pre id="out" style="font:13px monospace;white-space:pre-wrap">waiting</pre>
<script>
const KEY = 'agile-infographics.tom-wheel.v1', TKEY = 'agile-infographics.tom-wheel.theme.v1';
const f = document.getElementById('f'); const R = []; const errors = []; const notes = [];
const ok = (n, c, extra = '') => R.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : '  ' + extra));
const wait = ms => new Promise(r => setTimeout(r, ms));
let d, w;
function load() {
  return new Promise(res => {
    f.onload = async () => {
      d = f.contentDocument; w = f.contentWindow;
      w.addEventListener('error', e => errors.push(String(e.message)));
      const ce = w.console.error; w.console.error = (...a) => { errors.push(a.join(' ')); ce.apply(w.console, a); };
      for (let i = 0; i < 50 && !d.querySelector('.sw-seg'); i++) await wait(100);
      const st = d.createElement('style'); st.textContent = '*{transition:none!important}'; d.head.appendChild(st);
      await wait(100); res();
    };
    f.src = '/index.html?' + Math.random();
  });
}
// ---- colour helpers (WCAG) ----
const parse = s => { const m = s.match(/[\d.]+/g).map(Number); return m.slice(0, 3); };
const lum = rgb => { const [r, g, b] = rgb.map(v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const cr = (a, b) => { const x = lum(parse(a)), y = lum(parse(b)); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const cs = (el, p) => w.getComputedStyle(el)[p];
const hexRgb = h => `rgb(${parseInt(h.slice(1, 3), 16)}, ${parseInt(h.slice(3, 5), 16)}, ${parseInt(h.slice(5, 7), 16)})`;

const segs = () => [...d.querySelectorAll('.sw-seg')];
const rows = () => [...d.querySelectorAll('.sw-list-row')];
const panel = () => d.querySelector('.sw-panel');
const hexInput = () => d.querySelector('.te-hex');
const v = name => panel().style.getPropertyValue(name).trim();
function type(el, text) {
  el.focus();
  const proto = el.tagName === 'TEXTAREA' ? w.HTMLTextAreaElement.prototype : w.HTMLInputElement.prototype;
  Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, text);
  el.dispatchEvent(new w.Event('input', { bubbles: true }));
}
const click = el => el.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));

const DEFAULT_VARS = { '--sw-segment': '#8598aa', '--sw-segment-hover': '#6a8199', '--sw-segment-active': '#1f4670', '--sw-segment-disabled': '#a3b0bc',
  '--sw-segment-stroke': '#ffffff', '--sw-frame': '#ffffff', '--sw-disc': '#0b2a4a', '--sw-hub': '#ffffff', '--sw-hub-ring': 'transparent', '--sw-label': '#ffffff',
  '--sw-label-active': '#ffffff', '--sw-center-text': '#122f4d', '--sw-center-icon': '#173d63', '--sw-focus': '#29a8e0', '--sw-marker': '#3bb4ea',
  '--sw-surface': '#0f2740', '--sw-surface-raised': '#15324f', '--sw-border': 'rgba(120, 170, 205, 0.32)', '--sw-text': '#e9f1f7', '--sw-text-muted': '#a9bccb',
  '--sw-accent': '#5cc0ec', '--sw-dim': '0.55' };
function isDefaultLook(tag) {
  const diff = Object.entries(DEFAULT_VARS).filter(([k, val]) => v(k) !== val).map(([k, val]) => `${k}=${v(k)}≠${val}`);
  const bg = cs(d.querySelector('.gl-stage'), 'backgroundImage');
  ok(`[${tag}] all wheel/editor colours equal the approved default`, diff.length === 0, diff.join(', '));
  ok(`[${tag}] stage background is the approved default`, bg.includes('rgb(11, 31, 54)') && bg.includes('rgb(17, 48, 79)'), bg);
}

/** Readability + state checks on the rendered DOM for the current theme. */
async function readability(tag) {
  click(rows()[0]); await wait(30);
  const s0 = segs()[0], s1 = segs()[1], s2 = segs()[2];
  s2.dispatchEvent(new w.MouseEvent('mouseover', { bubbles: true, relatedTarget: d.body })); await wait(40);
  const fSel = cs(s0.querySelector('.sw-slice'), 'fill'), fHov = cs(s2.querySelector('.sw-slice'), 'fill'), fNorm = cs(s1.querySelector('.sw-slice'), 'fill');
  const lSel = cs(s0.querySelector('.sw-label'), 'fill'), lNorm = cs(s1.querySelector('.sw-label'), 'fill'), lHov = cs(s2.querySelector('.sw-label'), 'fill');
  const iSel = cs(s0.querySelector('.sw-icon'), 'color');
  ok(`[${tag}] hover works + normal / hover / selected fills distinct`, s2.classList.contains('is-hovered') && new Set([fSel, fHov, fNorm]).size === 3, [fNorm, fHov, fSel].join(' | '));
  s2.dispatchEvent(new w.MouseEvent('mouseout', { bubbles: true, relatedTarget: d.body })); await wait(30);
  const hub = d.querySelector('.sw-hub'), ct = d.querySelector('.sw-center-title');
  const det = d.querySelector('.sw-details'), title = d.querySelector('.te-name'), desc = d.querySelector('.te-description');
  const no = d.querySelector('.sw-details-no'), sub = d.querySelector('.sw-details-sub');
  const tile = d.querySelector('.te-icon-button');
  const stage = d.querySelector('.gl-stage'), stageTitle = d.querySelector('.gl-stage-title');
  const stageBg = cs(stage, 'backgroundImage').match(/rgb\([^)]*\)/g);
  const pairs = [
    ['wheel label / segment', cr(lNorm, fNorm), 2.95],
    ['wheel label / hover', cr(lHov, fHov), 4],
    ['selected label / selected', cr(lSel, fSel), 4.5],
    ['selected icon / selected', cr(iSel, fSel), 4.5],
    ['hub title / hub', cr(cs(ct, 'fill'), cs(hub, 'fill')), 7],
    ['details title / card', cr(cs(title, 'color'), cs(det, 'backgroundColor')), 7],
    ['description / card', cr(cs(desc, 'color'), cs(det, 'backgroundColor')), 7],
    ['section label / card', cr(cs(sub, 'color'), cs(det, 'backgroundColor')), 4.5],
    ['accent number / card', cr(cs(no, 'color'), cs(det, 'backgroundColor')), 4.5],
    ['icon tile glyph / tile', cr(cs(tile, 'color'), cs(tile, 'backgroundColor')), 4.5],
    ['list name / row', cr(cs(rows()[1], 'color'), cs(rows()[1], 'backgroundColor')), 7],
    ['hex field text / field', cr(cs(hexInput(), 'color'), cs(hexInput(), 'backgroundColor')), 7],
    ['stage title / stage bg', Math.min(...stageBg.map(c => cr(cs(stageTitle, 'color'), c))), 7],
  ];
  const bad = pairs.filter(([, c, min]) => c < min).map(([n, c, min]) => `${n} ${c.toFixed(2)}<${min}`);
  ok(`[${tag}] all key text/icon contrasts pass (${pairs.length} pairs)`, bad.length === 0, bad.join('; '));
  notes.push(`${tag}: ` + pairs.map(([n, c]) => `${n.split(' / ')[0]} ${c.toFixed(1)}`).join(', '));
  // Geometry is independent of colour: same paths as default.
  ok(`[${tag}] wheel geometry unchanged`, segs()[0].querySelector('.sw-slice').getAttribute('d') === window.__p0 && segs().length === 7);
}

async function run() {
  localStorage.removeItem(KEY); localStorage.removeItem(TKEY);
  await load();
  window.__p0 = segs()[0].querySelector('.sw-slice').getAttribute('d');
  ok('theme colour control present (swatch + HEX field) showing default', !!d.querySelector('.te-swatch input[type=color]') && hexInput().value === '#1f4670' && d.querySelector('input[type=color]').value === '#1f4670');
  ok('no "Default colour" button while default', ![...d.querySelectorAll('.te-link')].some(b => /Default colour/.test(b.textContent)));
  isDefaultLook('initial');
  await readability('default');

  const colours = { orange: '#ff7a00', purple: '#7b2cbf', green: '#2e9d4f', red: '#d62828', blue: '#1e6fd9', veryDark: '#0a0a0a', veryLight: '#f5f0e6', yellow: '#ffd400' };
  for (const [name, hex] of Object.entries(colours)) {
    type(hexInput(), hex); await wait(60);
    ok(`[${name}] HEX entry applies immediately`, v('--sw-segment-active') !== '' && JSON.parse(w.localStorage.getItem(TKEY)).primary === hex && d.querySelector('input[type=color]').value === hex);
    ok(`[${name}] palette is coordinated (not one flat colour)`, new Set(['--sw-segment', '--sw-segment-hover', '--sw-segment-active', '--sw-disc', '--sw-surface', '--sw-accent', '--sw-text'].map(v)).size === 7);
    await readability(name);
    hexInput().blur(); await wait(20);
  }
  notes.push('purple selected fill: ' + v('--sw-segment-active'));

  // Native colour picker
  const picker = d.querySelector('input[type=color]');
  Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype, 'value').set.call(picker, '#7b2cbf');
  picker.dispatchEvent(new w.Event('input', { bubbles: true })); await wait(50);
  ok('native colour picker applies immediately + updates HEX field', hexInput().value === '#7b2cbf' && v('--sw-segment-active') === '#7b2cbf');

  // Invalid / short HEX
  type(hexInput(), '#12zz'); await wait(40);
  ok('invalid HEX flagged and not applied', hexInput().getAttribute('aria-invalid') === 'true' && v('--sw-segment-active') === '#7b2cbf' && /HEX colour/.test(d.body.textContent));
  hexInput().blur(); await wait(30);
  ok('invalid HEX reverts on blur', hexInput().value === '#7b2cbf' && !hexInput().getAttribute('aria-invalid'));
  type(hexInput(), '#1f4'); await wait(40);
  ok('partial HEX is not applied while typing (no flashing)', v('--sw-segment-active') === '#7b2cbf');
  type(hexInput(), 'f80'); hexInput().blur(); await wait(40);
  ok('3-digit HEX applied on blur (normalised to #ff8800)', hexInput().value === '#ff8800' && JSON.parse(w.localStorage.getItem(TKEY)).primary === '#ff8800');

  // Theme + content independent
  type(d.querySelector('.te-name'), 'Purple Strategy'); d.activeElement.blur(); await wait(40);
  ok('content edit saved separately; theme key untouched', JSON.parse(w.localStorage.getItem(KEY)).components[0].name === 'Purple Strategy' && JSON.parse(w.localStorage.getItem(TKEY)).primary === '#ff8800' && !('primary' in JSON.parse(w.localStorage.getItem(KEY))));
  type(hexInput(), '#7b2cbf'); hexInput().blur(); await wait(40);
  ok('theme change does not touch content', JSON.parse(w.localStorage.getItem(KEY)).components[0].name === 'Purple Strategy');

  // Editing still works in a custom theme
  click(d.querySelector('.te-add')); await wait(40); type(d.querySelector('.te-name'), 'Themed Component'); d.activeElement.blur(); await wait(30);
  ok('editor works in custom theme (add + rename)', segs().length === 8 && rows()[1].textContent.includes('Themed Component'));
  click(d.querySelector(`[data-row="${JSON.parse(w.localStorage.getItem(KEY)).components[1].id}"] [data-action="delete"]`)); await wait(40);
  ok('delete works in custom theme', segs().length === 7);
  click(d.querySelector('.te-icon-button')); await wait(30);
  const cur = d.querySelector('.te-icon-option.is-current');
  ok('icon picker current item readable in custom theme', cr(cs(cur, 'color'), cs(cur, 'backgroundColor')) >= 4.5);
  click(cur); await wait(30);

  // Persistence
  await load();
  ok('after reload: theme colour restored (field + picker + wheel)', hexInput().value === '#7b2cbf' && d.querySelector('input[type=color]').value === '#7b2cbf' && v('--sw-segment-active') === '#7b2cbf');
  ok('after reload: stage background follows theme', !cs(d.querySelector('.gl-stage'), 'backgroundImage').includes('rgb(11, 31, 54)'));
  ok('after reload: content restored too', rows()[0].textContent.includes('Purple Strategy'));

  // "Default colour" resets theme only
  click([...d.querySelectorAll('.te-link')].find(b => /Default colour/.test(b.textContent))); await wait(40);
  ok('"Default colour" restores default theme only (content kept)', hexInput().value === '#1f4670' && rows()[0].textContent.includes('Purple Strategy') && w.localStorage.getItem(TKEY) === null);
  isDefaultLook('after Default colour');

  // Reset to default restores both
  type(hexInput(), '#2e9d4f'); hexInput().blur(); await wait(40);
  const reset = [...d.querySelectorAll('.te-link')].find(b => /Reset to default/.test(b.textContent));
  click(reset); await wait(30); click(reset); await wait(60);
  ok('Reset to default restores default content AND theme', rows()[0].textContent.includes('Strategy & Direction') && hexInput().value === '#1f4670' && w.localStorage.getItem(TKEY) === null);
  isDefaultLook('after Reset');
  await load();
  isDefaultLook('after Reset + reload');

  ok('no console errors / exceptions', errors.length === 0, JSON.stringify(errors));
  w.localStorage.removeItem(KEY); w.localStorage.removeItem(TKEY);
  document.getElementById('out').textContent = 'SUMMARY ' + R.filter(x => x.startsWith('PASS')).length + '/' + R.length + ' passed\n' + R.filter(x => x.startsWith('FAIL')).join('\n') + '\n----\n' + R.join('\n') + '\n\n' + R.filter(x => x.startsWith('PASS')).length + '/' + R.length + ' passed\n\n' + notes.join('\n');
}
run().catch(e => { document.getElementById('out').textContent = 'CRASH ' + e.stack + '\n' + R.join('\n'); });
</script></body></html>
